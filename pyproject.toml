[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A local-first, self-healing AI coding agent powered by Ollama."
readme = "README.md"
authors = [
    { name = "Ruru Labs", email = "contact@rurulabs.local" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "coding-agent", "self-healing", "ollama", "patching", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers -v"
markers = [
    "integration: requires external dependencies like live Ollama or Docker",
    "security: security and threat-boundary tests",
    "slow: tests with longer execution time",
    "diagnostic: inexpensive opt-in live diagnostic tests for external providers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long handled by formatter/line-length
    "B008", # do not perform function calls in argument defaults (Typer uses this)
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["patchpilot"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
